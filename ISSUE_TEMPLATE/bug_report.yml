name: 🐞 Bug report or Support Request
description: Create a report to help us improve.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Short summary (TL;DR)
      description: One or two sentences describing the problem, so anyone reading can tell at a glance what this is about. Details go in the sections below.
      placeholder: "`ddev start` fails with a port conflict after upgrading, on macOS with OrbStack."
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Preliminary checklist
      description: Please complete the checks that apply before submitting an issue.
      options:
        - label: I have searched the existing issues in this repository
          required: true
        - label: I am using the latest stable version of DDEV (see [upgrade guide](https://docs.ddev.com/en/stable/users/install/ddev-upgrade/)) and of this project, if it has releases
        - label: I have checked the [troubleshooting guide](https://docs.ddev.com/en/stable/users/usage/troubleshooting/)
  - type: textarea
    attributes:
      label: Output of `ddev utility test` or `ddev utility diagnose`
      value: |
        <details><summary>Expand `ddev utility test` diagnostic information</summary>

        ```
        [COPY-PASTE HERE THE OUTPUT OF `ddev utility test`]
        ```
        </details>
      description: |
        Diagnostic output skips a bunch of questions we'd have to ask afterwards. Run `ddev utility test` (or at least `ddev utility diagnose`) and paste the output here, or share a link to it via https://gist.github.com.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Actual Behavior
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction Steps
      description: Specific steps to reproduce the behavior.
      placeholder: |
        1. In this environment...
        2. With this config...
        3. Run `...`
        4. See error...
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Screenshots? Anything that will give us more context about your issue!

        💡 Attach images or log files by clicking this area to highlight it and dragging files in.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
        💙 DDEV is free and maintained by the nonprofit DDEV Foundation. If DDEV
        saves you or your team time, consider [sponsoring the project](https://ddev.com/sponsor).
